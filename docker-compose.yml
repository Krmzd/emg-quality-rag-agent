services:
  redis:
    image: redis/redis-stack-server:latest
    network_mode: host

  api:
    build: .
    network_mode: host
    environment:
      - AZURE_OPENAI_ENDPOINT
      - AZURE_OPENAI_API_KEY
      - REDIS_URL=redis://localhost:6379 
    volumes:
      - ./data:/app/data
    depends_on:                     
      - redis                             

  ui:
    build: .
    command: ["streamlit", "run", "ui/chat_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    network_mode: host
    environment:
      - API_URL=http://localhost:8000/chat
    depends_on:
      - api