[project]
name = "emg-quality-rag-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]
description = "AI agent that uses an LLM and RAG to check EMG signal quality and answer EMG data-collection questions with cited sources."

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
